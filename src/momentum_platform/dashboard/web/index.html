<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Workstation</title>
<link rel="stylesheet" href="styles.css">
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<div id="app" class="shell">

  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">Momentum Workstation</div>
        <div class="brand-sub" id="sessionLabel">loading…</div>
      </div>
    </div>

    <div class="clock">
      <div class="clock-time" id="clockET">--:--</div>
      <div class="clock-meta"><span id="sessionBadge" class="badge">—</span><span id="frameCounter" class="muted tiny">—</span></div>
    </div>

    <div class="transport" role="group" aria-label="Replay transport">
      <button id="btnPlay" class="btn primary">▶ Play</button>
      <button class="btn" data-seek="open">09:30</button>
      <button class="btn" data-seek="alert">Alert</button>
      <select id="speed" class="sel" aria-label="Replay speed">
        <option value="1">1×</option><option value="4" selected>4×</option>
        <option value="12">12×</option><option value="40">40×</option>
      </select>
      <input id="scrub" class="scrub" type="range" min="0" max="0" value="0" aria-label="Scrub replay">
    </div>

    <div class="health">
      <div class="health-row"><span id="feedDot" class="dot replay"></span><span id="feedText" class="health-text">REPLAY</span></div>
      <div class="health-sub" id="feedAge">fixture</div>
    </div>
    <div class="health">
      <div class="health-row"><span id="chartDot" class="dot"></span><span id="chartEngine" class="health-text">CHARTS</span></div>
      <div class="health-sub" id="chartEngineSub">detecting…</div>
    </div>

    <button id="btnTray" class="btn ghost" title="Cards not on the desk">⊞ Cards</button>
    <button id="btnLayout" class="btn ghost" title="Restore the default layout and sizes">⟲ Layout</button>
    <button id="btnSound" class="btn ghost" aria-pressed="false" title="Alert audio (A)">🔇</button>
  </header>

  <main class="grid" id="grid">
    <section class="col dock" data-col="left">
      <div class="slot" data-slot="L1" style="flex-grow:0.88"></div>
      <div class="gutter gutter-v" data-between="L1,L2" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize scanner cards"></div>
      <div class="slot" data-slot="L2" style="flex-grow:0.88"></div>
      <div class="gutter gutter-v" data-between="L2,L3" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize scanner cards"></div>
      <div class="slot" data-slot="L3" style="flex-grow:0.88"></div>
      <div class="gutter gutter-v" data-between="L3,L4" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize quote card"></div>
      <div class="slot" data-slot="L4" style="flex-grow:1.36"></div>
    </section>

    <div class="gutter gutter-h" data-cols="left" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize left column"></div>

    <section class="col workspace" data-col="center">
      <div class="sym-header" id="symHeader">
        <div class="sym-id">
          <span class="sym-ticker" id="symTicker">—</span>
          <span id="symLock" class="lock" hidden>LOCKED</span>
          <span id="symFlame" class="flame" hidden></span>
        </div>
        <div class="sym-stats" id="symStats"></div>
      </div>
      <div class="slot" data-slot="C1" style="flex-grow:1.7"></div>
      <div class="gutter gutter-v" data-between="C1,PAIR" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize the 1-minute chart"></div>
      <div class="pair" data-slot="PAIR" style="flex-grow:1.15">
        <div class="slot" data-slot="C2" style="flex-grow:1"></div>
        <div class="gutter gutter-h pair-gutter" data-pair="C2,C3" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize the 5-minute and 10-second charts"></div>
        <div class="slot" data-slot="C3" style="flex-grow:1"></div>
      </div>
      <div class="gutter gutter-v" data-between="PAIR,C4" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize the alert timeline"></div>
      <div class="slot" data-slot="C4" style="flex-grow:0.42"></div>
    </section>

    <div class="gutter gutter-h" data-cols="right" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize right column"></div>

    <section class="col context" data-col="right">
      <div class="slot" data-slot="R1" style="flex-grow:1.62"></div>
      <div class="gutter gutter-v" data-between="R1,R2" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize Level 2"></div>
      <div class="slot" data-slot="R2" style="flex-grow:1.05"></div>
    </section>
  </main>

  <div id="tray" class="tray" hidden aria-label="Cards not on the desk">
    <div class="tray-head">Available cards <span class="muted tiny">drag onto any card to swap it in</span></div>
    <div id="trayCards" class="tray-cards"></div>
  </div>

  <!-- Cards. Each is portable: the layout manager moves them between slots. -->
  <template id="cards">
    <article class="card" data-card="scan-pillars" data-kind="list" data-scanner="five_pillars_list"></article>
    <article class="card" data-card="scan-running" data-kind="alert" data-scanner="running_up"></article>
    <article class="card" data-card="scan-hod" data-kind="alert" data-scanner="hod_momentum"></article>

    <article class="card" data-card="quote">
      <div class="card-head"><span class="grip" title="Drag to another card to swap places">⠿</span>
        <span class="card-title">Quote · supply · risk · catalyst</span>
        <button class="icon-btn expand" title="Expand (E)">⛶</button></div>
      <div class="card-body" id="quoteCard"></div>
    </article>

    <article class="card chart-card" data-card="chart-1m">
      <div class="card-head"><span class="grip" title="Drag to another card to swap places">⠿</span>
        <span class="card-title">1 minute · execution</span>
        <span class="chart-role">entry · structural stop · trigger</span>
        <span class="legend"><i class="k vwap"></i>VWAP <i class="k ema9"></i>9 <i class="k ema20"></i>20 <i class="k hod"></i>HOD</span>
        <button class="icon-btn expand" title="Expand (E)">⛶</button></div>
      <div class="chart-host" id="chartA"></div>
    </article>

    <article class="card chart-card" data-card="chart-5m">
      <div class="card-head"><span class="grip">⠿</span>
        <span class="card-title">5 minute · structure</span>
        <span class="legend"><i class="k vwap"></i>VWAP <i class="k ema9"></i>9 <i class="k ema20"></i>20</span>
        <button class="icon-btn expand" title="Expand (E)">⛶</button></div>
      <div class="chart-host" id="chartB"></div>
    </article>

    <article class="card chart-card" data-card="chart-10s">
      <div class="card-head"><span class="grip">⠿</span>
        <span class="card-title">10 second · micro</span>
        <span class="legend"><i class="k vwap"></i>VWAP <i class="k ema9"></i>9</span>
        <button class="icon-btn expand" title="Expand (E)">⛶</button></div>
      <div class="chart-host" id="chartD"></div>
    </article>

    <article class="card chart-card" data-card="chart-daily">
      <div class="card-head"><span class="grip">⠿</span>
        <span class="card-title">Daily · room</span>
        <span class="legend"><i class="k ema20"></i>20 <i class="k ema200"></i>200 <i class="k h52"></i>52w</span>
        <button class="icon-btn expand" title="Expand (E)">⛶</button></div>
      <div class="chart-host" id="chartC"></div>
    </article>

    <article class="card" data-card="timeline">
      <div class="card-head"><span class="grip">⠿</span>
        <span class="card-title">Alert timeline</span>
        <span class="muted tiny" id="alertCount">0</span>
        <button class="icon-btn expand" title="Expand (E)">⛶</button></div>
      <div class="card-body timeline" id="timeline"></div>
    </article>

    <article class="card" data-card="level2">
      <div class="card-head"><span class="grip">⠿</span>
        <span class="card-title">Level 2 · Time &amp; Sales</span>
        <span class="tag sim">simulated</span>
        <button class="icon-btn expand" title="Expand (E)">⛶</button></div>
      <div class="card-body l2" id="l2Card"></div>
    </article>

    <article class="card verdict-card" data-card="verdict">
      <div class="card-head"><span class="grip">⠿</span>
        <span class="card-title">Setup verdict</span>
        <span class="tag">pine mirror</span>
        <button class="icon-btn expand" title="Expand (E)">⛶</button></div>
      <div class="card-body" id="verdictCard"></div>
      <div class="card-body sizing">
        <label class="risk-input"><span>Your risk / trade $</span>
          <input id="riskInput" type="number" min="1" step="5" placeholder="e.g. 25"
                 aria-label="Your dollar risk per trade"></label>
        <div id="sizingOut"></div>
      </div>
    </article>
  </template>

  <footer class="statusbar">
    <span id="disclaimer">Scanner events are research candidates, never entry signals or orders.</span>
    <span class="keys"><kbd>J</kbd><kbd>K</kbd> row · <kbd>Enter</kbd> lock · <kbd>Space</kbd> freeze · <kbd>E</kbd> expand · <kbd>A</kbd> audio · <kbd>Esc</kbd> back</span>
  </footer>
</div>

<script src="session.js"></script>
<script src="app.js"></script>
</body>
